services:
  db:
    image: pgvector/pgvector:pg16
    container_name: saydo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saydo
      POSTGRES_PASSWORD: saydo
      POSTGRES_DB: saydo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saydo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saydo -d saydo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saydo-pgdata:
