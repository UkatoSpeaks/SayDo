services:
  db:
    image: pgvector/pgvector:pg16
    container_name: saydo-db
    restart: unless-stopped
    # Credentials come from the root .env file (see .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saydo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-saydo}
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saydo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container's shell, which has these vars set.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saydo-pgdata:
